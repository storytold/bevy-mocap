name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  clippy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Sccache Action
      uses: Mozilla-Actions/sccache-action@v0.0.4
                          
    - name: Check Clippy
      run: cargo clippy --all
      
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Sccache Action
      uses: Mozilla-Actions/sccache-action@v0.0.4
    - name: Check Clippy
      run: cargo fmt --all

  build:  
    runs-on: ubuntu-latest
    needs: [clippy, format]
  
    steps:
    - uses: actions/checkout@v3
    - name: Sccache Action
      uses: Mozilla-Actions/sccache-action@v0.0.4
    - name: Build
      run: cargo build --verbose
      
  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v3
    - name: Sccache Action
      uses: Mozilla-Actions/sccache-action@v0.0.4
    - name: Run tests
      run: cargo test --verbose
